trigger:
- cvss4

pool:
  name: Default  # Self-hosted agent pool
  # Eğer agent adını kesin olarak belirtmek istersen:
  # demands:
  #   - Agent.Name -equals ubuntu-build

steps:
- script: |
    echo "Docker ve Compose kontrol ediliyor..."
    docker --version
    docker compose version
  displayName: "Check Docker"

- script: |
    cd $(Build.SourcesDirectory)

    echo "Eski container'lar kapatılıyor..."
    docker compose down --volumes || true

    echo "Yeni build yapılıyor..."
    docker compose build

    echo "Uygulama başlatılıyor..."
    docker compose up -d
  displayName: "Build & Deploy on Ubuntu Server"
